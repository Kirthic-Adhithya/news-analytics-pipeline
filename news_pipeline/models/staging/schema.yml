version: 2

models:
  - name: stg_articles
    description: Cleaned and normalised articles from gold layer
    columns:
      - name: article_id
        description: MD5 surrogate key
        tests:
          - not_null
          - unique
      - name: title
        tests: [not_null]
      - name: published_at
        tests: [not_null]
      - name: sentiment_label
        tests:
          - accepted_values:
              arguments:
                values: ['POSITIVE', 'NEGATIVE', 'NEUTRAL']
